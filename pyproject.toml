[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-cost-tracker"
version = "0.1.0"
description = "Lightweight cost tracking and budget alerts for LLM API calls"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Riaz Shaik", email = "riazshaik.nm@gmail.com" }]
keywords = ["llm", "cost", "tracking", "openai", "anthropic", "budget", "tokens", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
all = ["openai>=1.0", "anthropic>=0.30"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

[project.scripts]
llm-cost = "llm_cost_tracker.cli:main"

[project.urls]
Homepage = "https://github.com/riazshaik-nm/llm-cost-tracker"
Repository = "https://github.com/riazshaik-nm/llm-cost-tracker"
Issues = "https://github.com/riazshaik-nm/llm-cost-tracker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cost_tracker"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true
